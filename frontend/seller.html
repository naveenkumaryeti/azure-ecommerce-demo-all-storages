<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuickKart</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head>
<body><div id="nav"></div><main class="container my-4"><div class="d-flex justify-content-between align-items-center mb-3"><h3>Product Management</h3><button class="btn btn-primary" onclick="openForm()"><i class="bi bi-plus-lg"></i> Add New Product</button></div>
<div class="card"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th></th><th>ID</th><th>Product</th><th>Price</th><th>Stock</th><th>Status</th><th></th></tr></thead><tbody id="ptable"></tbody></table></div></div></main>
<div class="modal fade" id="pmodal" tabindex="-1"><div class="modal-dialog modal-lg"><form class="modal-content" id="pform"><div class="modal-header"><h5 class="modal-title" id="mtitle"></h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
<div class="modal-body row g-3"><input type="hidden" name="pid"><input type="hidden" name="etag"><div class="col-md-7"><label class="form-label">Product name</label><input class="form-control" name="product_name" required maxlength="100">
<div class="row mt-2"><div class="col"><label class="form-label">Colour</label><input class="form-control" name="colour"></div><div class="col"><label class="form-label">Product status label</label><input class="form-control" name="product_status" placeholder="e.g. Recently Launched"></div></div>
<div class="row mt-2"><div class="col"><label class="form-label">Selling price (₹)</label><input class="form-control" name="price" type="number" min="0.01" step="0.01" placeholder="required to publish"></div><div class="col"><label class="form-label">Available quantity</label><input class="form-control" name="available_quantity" type="number" min="0" required></div></div>
<label class="form-label mt-2">Category</label><input class="form-control" name="category" value="General"><label class="form-label mt-2">Description</label><textarea class="form-control" name="description" rows="3"></textarea></div>
<div class="col-md-5"><label class="form-label">Product image (JPG / PNG / WebP, max 5 MB)</label><img id="preview" class="thumb-lg rounded mb-2"><input class="form-control" type="file" name="image" accept="image/jpeg,image/png,image/webp"></div></div>
<div class="modal-footer justify-content-between"><button type="button" class="btn btn-link" onclick="demoValues()">Fill iPhone 8 demo values</button><div><button class="btn btn-secondary" type="button" data-bs-dismiss="modal">Cancel</button> <button class="btn btn-primary" id="saveBtn">Save product</button></div></div></form></div></div>
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/app.js"></script><script src="js/seller.js"></script></body></html>
