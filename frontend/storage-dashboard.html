<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuickKart</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head>
<body><div id="nav"></div><main class="container my-4"><h3><i class="bi bi-database"></i> Azure Storage Dashboard</h3><div class="row g-3 mb-4" id="stats"></div>
<h3 class="mt-4"><i class="bi bi-folder2-open"></i> Azure Blob Storage Explorer</h3><div class="row g-3"><div class="col-md-3"><div class="list-group mb-3" id="clist"></div>
<form id="upform" class="card card-body"><h6>Upload (.json / image)</h6><select class="form-select mb-2" name="container" id="upc"></select><input class="form-control mb-2" type="file" name="file" accept=".json,.jpg,.jpeg,.png,.webp" required><button class="btn btn-primary btn-sm">Upload</button>
<small class="text-muted mt-2">Tip: name test files <code>test-*.json</code> so they can be deleted.</small></form></div>
<div class="col-md-9"><div class="card mb-3"><div class="card-header" id="btitle">Select a container</div><div class="table-responsive"><table class="table table-sm align-middle mb-0"><thead><tr><th>Name</th><th>Content type</th><th>Size</th><th>Last modified</th><th></th></tr></thead><tbody id="btable"></tbody></table></div></div><div id="viewer"></div></div></div></main>
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/app.js"></script><script src="js/storage.js"></script></body></html>
