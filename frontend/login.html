<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuickKart</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head>
<body><div id="nav"></div><main class="container my-5"><div class="row g-4 justify-content-center"><div class="col-md-5"><form id="lf" class="card card-body"><h4>Login</h4><p class="text-muted small">Seller, admin/delivery operator or customer</p>
<input class="form-control mb-2" type="email" name="email" placeholder="Email" required><input class="form-control mb-3" type="password" name="password" placeholder="Password" required><button class="btn btn-primary">Login</button></form></div>
<div class="col-md-5"><form id="rf" class="card card-body"><h4>New customer</h4><input class="form-control mb-2" name="name" placeholder="Full name" required><input class="form-control mb-2" type="email" name="email" placeholder="Email" required>
<input class="form-control mb-3" type="password" name="password" minlength="8" placeholder="Password (min 8 chars)" required><button class="btn btn-outline-primary">Register</button></form></div></div></main>
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/app.js"></script><script src="js/auth.js"></script></body></html>
