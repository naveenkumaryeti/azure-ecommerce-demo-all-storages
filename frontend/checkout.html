<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuickKart</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet"></head>
<body data-page="checkout"><div id="nav"></div><main class="container my-4" style="max-width:760px"><h3>Checkout</h3><div id="checkout"><div class="card card-body mb-3" id="summary"></div>
<form id="cf" class="card card-body"><label class="form-label fw-bold">Payment method</label><div class="form-check mb-3"><input class="form-check-input" type="radio" checked id="cod"><label class="form-check-label" for="cod">Cash on Delivery (COD) - pay in cash when the order arrives</label></div>
<label class="form-label fw-bold">Delivery address</label><textarea class="form-control mb-3" name="address" rows="3" minlength="10" required placeholder="House no, street, city, PIN"></textarea>
<button class="btn btn-success btn-lg" id="confirm">Confirm Order</button></form></div></main>
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toasts"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/app.js"></script><script src="js/shop.js"></script></body></html>
